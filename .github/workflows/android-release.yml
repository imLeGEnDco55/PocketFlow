name: Android signed release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ["KEYSTORE_B64", "STORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD"]
          missing = [n for n in names if not os.environ.get(n)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))
          key = Path(os.environ["RUNNER_TEMP"]) / "pocketflow-release.jks"
          key.write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"], validate=True))
          key.chmod(0o600)
          def prop(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace(" ", "\\ ")
          values = dict(storeFile=str(key), storePassword=os.environ["STORE_PASSWORD"], keyAlias=os.environ["KEY_ALIAS"], keyPassword=os.environ["KEY_PASSWORD"])
          Path("keystore.properties").write_text("".join(k + "=" + prop(v) + "\n" for k,v in values.items()))
          Path("keystore.properties").chmod(0o600)
          PY
      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify signature and checksum
        run: |
          mkdir -p signed-apk
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" signed-apk/
          done
          cd signed-apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: PocketFlow-release-signed
          path: signed-apk/
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/pocketflow-release.jks"
